name: Refresh Nexus Mods downloads

on:
  schedule:
    - cron: '24 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-downloads-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test stats parser and localization
        run: node --test scripts/test-nexus-downloads.mjs
      - name: Read Nexus Mods and refresh snapshot
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: node scripts/update-nexus-downloads.mjs
      - name: Commit updated snapshot only
        run: |
          if git diff --quiet -- data/nexus-downloads.json; then
            echo 'Snapshot already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nexus-downloads.json
          git commit -m 'data: refresh Nexus Mods download total'
          git push origin HEAD:main
