name: Validate homepage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-site.mjs # includes: en/index.html and sitemap.xml are in sync with the build
      - run: node --test scripts/test-disclosures.mjs
      - run: node --test scripts/test-nexus-downloads.mjs
      - run: node --check scripts/nexus-downloads.mjs
