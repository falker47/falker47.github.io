name: Validate site

on:
  pull_request:
  push:
    branches: [main, unify, 'codex/**']

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare cold-browser budget check
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@^1
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          echo "QA_TOOLS_DIR=$RUNNER_TEMP/portfolio-browser" >> "$GITHUB_ENV"
          echo "QA_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - run: node scripts/check.mjs
